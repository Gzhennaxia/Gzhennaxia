# Gzhennaxia Windows Nginx 站点配置
# 用法：在 E:\SOFTWARE\nginx-1.30.1\conf\nginx.conf 的 http {} 内增加：
#   include E:/SOFTWARE/gzhennaxia/nginx-gzhennaxia.conf;
# 或将本文件内容合并进 nginx.conf 的 server {} 块。
#
# 服务器项目根目录：E:/SOFTWARE/gzhennaxia

server {
    listen       80;
    server_name  localhost;

    # 前端静态资源（npm run build 后的 dist 目录）
    root   E:/SOFTWARE/gzhennaxia/dist;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:9527/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
    }

    error_page   500 502 503 504  /50x.html;
}
