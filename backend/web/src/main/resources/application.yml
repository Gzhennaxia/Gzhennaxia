server:
  port: 9527

spring:
  # 存在 application-local.yml 时自动加载（已 gitignore，含本地密码）
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/gzhennaxia
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # 首次建表可改为 always，建完改回 never（见 docs/postgresql-migration.md）
  sql:
    init:
      mode: never
      continue-on-error: true
      schema-locations: classpath:db/schema.sql,classpath:db/accounting.sql,classpath:db/question-bank.sql,classpath:db/finance-market.sql

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  type-handlers-package: com.personal.management.config

logging:
  level:
    root: INFO
    com.example.dict: DEBUG
    org.springframework: WARN
    com.baomidou.mybatisplus: DEBUG

finance:
  market:
    fred:
      api-key: ${FRED_API_KEY:}
      base-url: https://api.stlouisfed.org/fred
    stooq:
      enabled: false
    sync:
      default-symbol: SP500
      backfill-start: 2010-01-01
  file:
    name: logs/dict-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
