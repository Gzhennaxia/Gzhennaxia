server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: question-bank-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gzhennaxia}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}

  sql:
    init:
      mode: never
      continue-on-error: true
      schema-locations: classpath:db/question-bank.sql

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.gzhennaxia.questionbank: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  upload:
    path: uploads/
  image:
    path: uploads/images/
  pdf:
    path: uploads/pdfs/
  ffmpeg:
    path: D:/SOFTERWARE/ffmpeg-7.1.1-full_build/bin
