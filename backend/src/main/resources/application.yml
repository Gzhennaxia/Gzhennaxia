server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gzhennaxia?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Libo9527.123

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # Redis缓存配置
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gzhennaxia.personal.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: R3poZW5uYXhpYV9KV1RfU2VjcmV0X0tleV8yMDI0
  expiration: 86400000  # 24小时

# Interactive Brokers API配置
ib:
  accountId: U16166218
  api:
    gateway:
      url: https://localhost:5000
    sync:
      enabled: true
      cron: "0 */5 * * * *"  # 每5分钟同步一次
      timeout: 30000  # 同步超时时间（毫秒）
  # Gateway 自动启动配置
  gateway:
    enabled: true  # 是否在应用启动时自动启动Gateway
    path: D:/SOFTERWARE/clientportal.beta.gw  # Gateway安装路径
    auto:
      open:
        browser: true  # 是否自动打开浏览器
    startup:
      timeout: 30  # 启动超时时间（秒）

# 前端服务配置
frontend:
  enabled: true  # 是否启用前端自动启动
  path: frontend  # 前端项目路径（相对于后端项目根目录）
  url: http://localhost:3000  # 前端访问地址
  auto:
    open:
      browser: true  # 是否自动打开浏览器
  startup:
    timeout: 60  # 启动超时时间（秒）

# 启动协调器配置
startup:
  coordinator:
    enabled: true  # 是否启用启动协调器
    parallel: true  # 是否并行启动（true：同时启动，false：顺序启动）

# 日志配置
logging:
  level:
    root: info
    com.gzhennaxia.personal: debug
  file:
    name: logs/application.log