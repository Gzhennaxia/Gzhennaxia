<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人记账 - 月报</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
<div id="navbar"></div>

<main class="max-w-7xl mx-auto px-4 py-8">
<h1 class="text-xl font-bold mb-6">2026年5月 财务月报</h1>
<section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
<div class="bg-white rounded-xl p-4 shadow-sm"><p class="text-gray-500 text-sm">收入</p><p class="text-xl font-bold text-emerald-600">28,500</p></div>
<div class="bg-white rounded-xl p-4 shadow-sm"><p class="text-gray-500 text-sm">支出</p><p class="text-xl font-bold text-red-500">12,368</p></div>
<div class="bg-white rounded-xl p-4 shadow-sm"><p class="text-gray-500 text-sm">结余</p><p class="text-xl font-bold">16,132</p></div>
<div class="bg-white rounded-xl p-4 shadow-sm"><p class="text-gray-500 text-sm">储蓄率</p><p class="text-xl font-bold">56.6%</p></div>
</section>
<section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
<div class="bg-white rounded-xl p-6 shadow-sm">
<h2 class="font-semibold mb-4">支出分类 Top 5</h2>
<ul class="space-y-2 text-sm">
<li class="flex justify-between"><span>餐饮</span><span>3,820 (31%)</span></li>
<li class="flex justify-between"><span>居住</span><span>2,800 (23%)</span></li>
<li class="flex justify-between"><span>交通</span><span>1,420 (11%)</span></li>
<li class="flex justify-between"><span>购物</span><span>1,200 (10%)</span></li>
<li class="flex justify-between"><span>娱乐 <span class="text-red-500">超预算</span></span><span>680 (6%)</span></li>
</ul>
</div>
<div class="bg-white rounded-xl p-6 shadow-sm">
<h2 class="font-semibold mb-4">收支趋势（示意）</h2>
<div class="h-48 bg-gradient-to-t from-emerald-50 to-white rounded-lg flex items-end justify-around px-4 pb-2">
<span class="w-8 bg-emerald-400 rounded-t" style="height:40%"></span>
<span class="w-8 bg-red-300 rounded-t" style="height:25%"></span>
<span class="w-8 bg-emerald-400 rounded-t" style="height:55%"></span>
<span class="w-8 bg-red-300 rounded-t" style="height:30%"></span>
<span class="w-8 bg-emerald-500 rounded-t" style="height:70%"></span>
</div>
<p class="text-xs text-gray-400 text-center mt-2">正式版可接 ECharts</p>
</div>
</section>
</main>
<script>fetch('navbar.html').then(r=>r.text()).then(h=>document.getElementById('navbar').innerHTML=h);</script>
</body>
</html>
