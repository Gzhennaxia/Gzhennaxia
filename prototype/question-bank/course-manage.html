<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库系统 - 课程管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<!-- 引入导航栏 -->
<div id="navbar"></div>
<script>
    // 加载导航栏
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar').innerHTML = html;
            // 从加载的内容中提取并执行脚本
            const scripts = document.getElementById('navbar').getElementsByTagName('script');
            for (let script of scripts) {
                eval(script.innerHTML);
            }
        });
</script>
<!-- 课程管理内容 -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 顶部操作栏 -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">课程管理</h1>
        <div class="flex gap-3">
            <button id="addCourseBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors">
                <i class="fa fa-plus mr-1"></i>添加课程
            </button>
        </div>
    </div>

    <!-- 课程列表 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- 课程卡片1 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow">
            <div class="h-40 bg-gray-200 flex items-center justify-center">
                <i class="fa fa-book text-4xl text-gray-400"></i>
            </div>
            <div class="p-4">
                <h3 class="text-lg font-medium text-gray-800 mb-1">公务员行测基础</h3>
                <p class="text-sm text-gray-500 mb-2">讲师: 李老师</p>
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-500">8个课时</span>
                    <a href="course-detail.html" class="text-blue-500 hover:text-blue-700 text-sm font-medium">
                        查看详情 <i class="fa fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- 课程卡片2 -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition-shadow">
            <div class="h-40 bg-gray-200 flex items-center justify-center">
                <i class="fa fa-book text-4xl text-gray-400"></i>
            </div>
            <div class="p-4">
                <h3 class="text-lg font-medium text-gray-800 mb-1">申论写作技巧</h3>
                <p class="text-sm text-gray-500 mb-2">讲师: 王老师</p>
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-500">6个课时</span>
                    <a href="course-detail.html" class="text-blue-500 hover:text-blue-700 text-sm font-medium">
                        查看详情 <i class="fa fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 添加课程弹窗 -->
<div id="courseModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
            <h3 class="text-lg font-medium text-gray-900">添加课程</h3>
            <button id="closeModalBtn" class="text-gray-400 hover:text-gray-500">
                <i class="fa fa-times text-xl"></i>
            </button>
        </div>
        <div class="px-6 py-4">
            <form id="courseForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">课程名称</label>
                    <input type="text" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">讲师姓名</label>
                    <input type="text" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">课程描述</label>
                    <textarea rows="3" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm"></textarea>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="cancelBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300 transition-colors">
                        取消
                    </button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // 显示/隐藏添加课程弹窗
    document.getElementById('addCourseBtn').addEventListener('click', function() {
        document.getElementById('courseModal').classList.remove('hidden');
    });

    document.getElementById('closeModalBtn').addEventListener('click', function() {
        document.getElementById('courseModal').classList.add('hidden');
    });

    document.getElementById('cancelBtn').addEventListener('click', function() {
        document.getElementById('courseModal').classList.add('hidden');
    });
</script>
</body>
</html>
