<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库系统 - 编辑课程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<!-- 引入导航栏 -->
<div id="navbar"></div>
<script>
    // 加载导航栏
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar').innerHTML = html;
            // 从加载的内容中提取并执行脚本
            const scripts = document.getElementById('navbar').getElementsByTagName('script');
            for (let script of scripts) {
                eval(script.innerHTML);
            }
        });
</script>
<!-- 编辑课程内容 -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">编辑课程信息</h1>

        <form id="editCourseForm">
            <!-- 课程基本信息 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">课程名称</label>
                <input type="text" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2"
                       value="公务员行测基础" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">讲师姓名</label>
                <input type="text" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2"
                       value="李老师">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">课程描述</label>
                <textarea rows="4" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2">本课程全面讲解公务员行测考试中的各类题型和解题技巧，包括言语理解、数量关系、判断推理和资料分析等内容。</textarea>
            </div>

            <!-- 封面图片 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">课程封面</label>
                <div class="flex items-center gap-4">
                    <div class="w-32 h-32 bg-gray-200 rounded-lg flex items-center justify-center">
                        <i class="fa fa-book text-4xl text-gray-400"></i>
                    </div>
                    <div class="flex-1">
                        <label class="relative bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors cursor-pointer">
                            <i class="fa fa-upload mr-1"></i>更换封面
                            <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*">
                        </label>
                        <p class="text-xs text-gray-500 mt-2">建议尺寸: 800x450px, 支持JPG/PNG格式</p>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" id="cancelEditBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300 transition-colors">
                    取消
                </button>
                <button type="submit" id="saveCourseBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors">
                    <i class="fa fa-save mr-1"></i>保存更改
                </button>
            </div>
        </form>
    </div>
</main>

<script>
    // 表单提交处理
    document.getElementById('editCourseForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const saveBtn = document.getElementById('saveCourseBtn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i> 保存中...';

        // 模拟异步保存
        setTimeout(() => {
            saveBtn.innerHTML = '<i class="fa fa-check mr-1"></i> 保存成功';
            saveBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
            saveBtn.classList.add('bg-green-500', 'hover:bg-green-600');

            // 2秒后返回课程详情页
            setTimeout(() => {
                window.location.href = 'course-detail.html';
            }, 2000);
        }, 1500);
    });

    // 取消按钮
    document.getElementById('cancelEditBtn').addEventListener('click', function() {
        if(confirm('确定要取消编辑吗？所有未保存的更改将丢失。')) {
            window.location.href = 'course-detail.html';
        }
    });
</script>
</body>
</html>
