<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库系统 - 添加课时</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<!-- 引入导航栏 -->
<div id="navbar"></div>
<script>
    // 加载导航栏
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar').innerHTML = html;
            // 从加载的内容中提取并执行脚本
            const scripts = document.getElementById('navbar').getElementsByTagName('script');
            for (let script of scripts) {
                eval(script.innerHTML);
            }
        });
</script>
<!-- 添加课时内容 -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">添加新课时</h1>

        <form id="addLessonForm">
            <!-- 课程选择 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">所属课程</label>
                <select class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2">
                    <option value="">请选择课程</option>
                    <option value="1">公务员行测基础</option>
                    <option value="2">申论写作技巧</option>
                    <option value="3">面试实战演练</option>
                </select>
            </div>

            <!-- 课时信息 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">课时名称</label>
                <input type="text" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2" placeholder="例如: 第一讲 逻辑判断">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">课时顺序</label>
                <input type="number" min="1" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2" placeholder="例如: 1">
            </div>

            <!-- 资源上传 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">上传视频</label>
                <div class="flex items-center gap-3">
                    <label class="relative bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors cursor-pointer">
                        <i class="fa fa-upload mr-1"></i>选择视频文件
                        <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" accept="video/*">
                    </label>
                    <span class="text-sm text-gray-500">支持MP4格式，最大500MB</span>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">上传讲义</label>
                <div class="flex items-center gap-3">
                    <label class="relative bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors cursor-pointer">
                        <i class="fa fa-upload mr-1"></i>选择讲义文件
                        <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" accept=".pdf,.doc,.docx">
                    </label>
                    <span class="text-sm text-gray-500">支持PDF/DOC格式，最大50MB</span>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" id="cancelBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300 transition-colors">
                    取消
                </button>
                <button type="submit" id="submitBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors">
                    <i class="fa fa-plus mr-1"></i>添加课时
                </button>
            </div>
        </form>
    </div>
</main>

<script>
    // 表单提交处理
    document.getElementById('addLessonForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i> 正在添加...';

        // 模拟异步提交
        setTimeout(() => {
            submitBtn.innerHTML = '<i class="fa fa-check mr-1"></i> 添加成功';
            submitBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
            submitBtn.classList.add('bg-green-500', 'hover:bg-green-600');

            // 2秒后跳转回课程详情页
            setTimeout(() => {
                window.location.href = 'course-detail.html';
            }, 2000);
        }, 1500);
    });

    // 取消按钮
    document.getElementById('cancelBtn').addEventListener('click', function() {
        if(confirm('确定要取消添加课时吗？所有未保存的内容将丢失。')) {
            window.location.href = 'course-detail.html';
        }
    });
</script>
</body>
</html>
