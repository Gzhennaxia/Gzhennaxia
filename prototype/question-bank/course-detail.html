<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库系统 - 课程详情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<!-- 引入导航栏 -->
<div id="navbar"></div>
<script>
    // 加载导航栏
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar').innerHTML = html;
            // 从加载的内容中提取并执行脚本
            const scripts = document.getElementById('navbar').getElementsByTagName('script');
            for (let script of scripts) {
                eval(script.innerHTML);
            }
        });
</script>
<!-- 课程详情内容 -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 课程基本信息 -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
        <div class="flex flex-col md:flex-row gap-6">
            <div class="w-full md:w-1/3 lg:w-1/4">
                <div class="h-48 bg-gray-200 rounded-lg flex items-center justify-center">
                    <i class="fa fa-book text-6xl text-gray-400"></i>
                </div>
            </div>
            <div class="w-full md:w-2/3 lg:w-3/4">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">公务员行测基础</h1>
                <p class="text-sm text-gray-500 mb-4">讲师: 李老师</p>
                <p class="text-gray-700 mb-4">
                    本课程全面讲解公务员行测考试中的各类题型和解题技巧，包括言语理解、数量关系、判断推理和资料分析等内容。
                </p>
                <div class="flex gap-3">
                    <button id="editCourseBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 active:bg-blue-700 transition-colors transform hover:scale-105 active:scale-95">
                        <i class="fa fa-edit mr-1"></i>编辑课程
                    </button>
                    <button id="addLessonBtn" class="bg-green-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-green-600 active:bg-green-700 transition-colors transform hover:scale-105 active:scale-95">
                        <i class="fa fa-plus mr-1"></i>添加课时
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 课时列表 -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden mb-6">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        课时名称
                    </th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        顺序
                    </th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        视频
                    </th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        讲义
                    </th>
                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                        操作
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <!-- 课时1 -->
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-800">
                        第一讲 逻辑判断
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        1
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="text-green-500">已上传</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="text-green-500">已上传</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="lesson-detail.html" class="text-blue-500 hover:text-blue-700 mr-3">
                            <i class="fa fa-eye mr-1"></i>查看
                        </a>
                        <a href="#" class="text-blue-500 hover:text-blue-700 mr-3 edit-lesson-btn">
                            <i class="fa fa-edit mr-1"></i>编辑
                        </a>
                        <a href="#" class="text-red-500 hover:text-red-700 delete-lesson-btn">
                            <i class="fa fa-trash mr-1"></i>删除
                        </a>
                    </td>
                </tr>
                <!-- 课时2 -->
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-800">
                        第二讲 数量关系
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        2
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="text-gray-500">未上传</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="text-gray-500">未上传</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <a href="lesson-detail.html" class="text-blue-500 hover:text-blue-700 mr-3">
                            <i class="fa fa-eye mr-1"></i>查看
                        </a>
                        <a href="#" class="text-blue-500 hover:text-blue-700 mr-3">
                            <i class="fa fa-edit mr-1"></i>编辑
                        </a>
                        <a href="#" class="text-red-500 hover:text-red-700">
                            <i class="fa fa-trash mr-1"></i>删除
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // 编辑课程按钮点击事件
    document.getElementById('editCourseBtn').addEventListener('click', function() {
        this.classList.add('animate-pulse');
        setTimeout(() => {
            this.classList.remove('animate-pulse');
            window.location.href = 'course-edit.html';
        }, 300);
    });

    // 添加课时按钮点击事件
    document.getElementById('addLessonBtn').addEventListener('click', function() {
        this.classList.add('animate-pulse');
        setTimeout(() => {
            this.classList.remove('animate-pulse');
            window.location.href = 'lesson-add.html';
        }, 300);
    });

    // 课时操作按钮交互
    document.querySelectorAll('.edit-lesson-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const lessonName = this.closest('tr').querySelector('td:first-child').textContent.trim();
            alert(`即将编辑课时: ${lessonName}`);
        });
    });

    document.querySelectorAll('.delete-lesson-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const lessonName = this.closest('tr').querySelector('td:first-child').textContent.trim();
            if (confirm(`确定要删除课时 "${lessonName}" 吗？此操作不可撤销！`)) {
                this.closest('tr').classList.add('opacity-50', 'bg-red-50');
                setTimeout(() => {
                    alert(`课时 "${lessonName}" 已删除`);
                }, 500);
            }
        });
    });
</script>
</body>
</html>
