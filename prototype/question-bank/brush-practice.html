<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库系统 - 刷题练习</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<!-- 引入导航栏 -->
<div id="navbar"></div>

<!-- 刷题练习内容 -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 刷题进度 -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-6 flex justify-between items-center">
        <div class="text-gray-700">
            <span class="font-medium">进度:</span>
            <span id="progress">1/20</span>
        </div>
        <div class="text-gray-700">
            <span class="font-medium">剩余时间:</span>
            <span id="timer">30:00</span>
        </div>
    </div>

    <!-- 试题展示区 -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
        <!-- 题型标识 -->
        <div class="mb-4">
            <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full" id="questionType">单选题</span>
        </div>

        <!-- 题干内容 -->
        <div class="mb-6">
            <p class="text-lg text-gray-800" id="questionContent">下列选项中，属于"断点拆桥"削弱论证的核心逻辑是？</p>
        </div>

        <!-- 选项区（选择题） -->
        <div class="space-y-3 mb-6" id="optionsContainer">
            <div class="flex items-center">
                <input type="radio" name="answer" id="optionA" class="mr-2">
                <label for="optionA" class="text-gray-800">A. 否定论据</label>
            </div>
            <div class="flex items-center">
                <input type="radio" name="answer" id="optionB" class="mr-2">
                <label for="optionB" class="text-gray-800">B. 切断联系</label>
            </div>
        </div>

        <!-- 填空题输入区 -->
        <div class="mb-6 hidden" id="fillContainer">
            <input type="text" id="fillAnswer" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2" placeholder="请输入答案">
        </div>

        <!-- 解析区（提交后显示） -->
        <div class="hidden" id="analysisContainer">
            <div class="p-4 bg-blue-50 rounded-md mb-4">
                <p class="font-medium text-gray-800">正确答案: <span id="correctAnswer" class="text-green-600">B</span></p>
                <p class="text-gray-700 mt-2" id="analysisContent">断点拆桥的核心逻辑是切断论据与论点之间的联系，而非直接否定论据。</p>
            </div>
        </div>
    </div>

    <!-- 操作按钮区 -->
    <div class="flex justify-between">
        <button id="prevBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300 transition-colors">
            <i class="fa fa-arrow-left mr-1"></i>上一题
        </button>
        <div class="flex gap-2">
            <button id="markBtn" class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-yellow-200 transition-colors">
                <i class="fa fa-bookmark mr-1"></i>标记待查
            </button>
            <button id="submitBtn" class="bg-blue-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-600 transition-colors">
                <i class="fa fa-check mr-1"></i>提交答案
            </button>
        </div>
        <button id="nextBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-300 transition-colors">
            下一题<i class="fa fa-arrow-right ml-1"></i>
        </button>
    </div>
</main>

<script>
    // 加载导航栏
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => document.getElementById('navbar').innerHTML = data);

    // 设置当前导航项激活状态
    document.getElementById('nav-brush').classList.add('nav-active');
    document.getElementById('nav-brush').classList.remove('text-gray-600', 'hover:text-blue-500');
</script>
</body>
</html>
