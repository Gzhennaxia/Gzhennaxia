<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人题库系统 - 导航栏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .nav-active {
            @apply border-b-2 border-blue-500 text-blue-500 font-medium;
        }
    </style>
</head>
<body class="bg-gray-50">
<!-- 导航栏 -->
<nav class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <!-- 左侧 Logo -->
            <div class="flex items-center">
                <i class="fa fa-book text-blue-500 text-2xl mr-2"></i>
                <span class="text-xl font-bold text-gray-800">个人题库系统</span>
            </div>
            <!-- 右侧导航 -->
            <div class="flex items-center space-x-6">
                <a href="home.html" class="nav-active px-3 py-2 text-sm" id="nav-home">
                    <i class="fa fa-home mr-1"></i>首页
                </a>
                <a href="course-manage.html" class="px-3 py-2 text-sm text-gray-600 hover:text-blue-500 transition-colors" id="nav-course">
                    <i class="fa fa-video-camera mr-1"></i>课程管理
                </a>
                <a href="question-manage.html" class="px-3 py-2 text-sm text-gray-600 hover:text-blue-500 transition-colors" id="nav-question">
                    <i class="fa fa-list mr-1"></i>题库管理
                </a>
                <a href="brush-practice.html" class="px-3 py-2 text-sm text-gray-600 hover:text-blue-500 transition-colors" id="nav-brush">
                    <i class="fa fa-pencil mr-1"></i>刷题练习
                </a>
                <a href="wrong-book.html" class="px-3 py-2 text-sm text-gray-600 hover:text-blue-500 transition-colors" id="nav-wrong">
                    <i class="fa fa-exclamation-circle mr-1"></i>错题本
                </a>
                <a href="statistic.html" class="px-3 py-2 text-sm text-gray-600 hover:text-blue-500 transition-colors" id="nav-stat">
                    <i class="fa fa-bar-chart mr-1"></i>数据统计
                </a>
            </div>
        </div>
    </div>
</nav>

<script>
    // 导航栏激活状态切换（根据当前页面URL设置）
    const currentUrl = window.location.href;
    const navItems = ['home', 'course', 'question', 'brush', 'wrong', 'stat'];
    navItems.forEach(item => {
        const navElement = document.getElementById(`nav-${item}`);
        if (currentUrl.includes(`${item}.html`)) {
            navElement.classList.add('nav-active');
            navElement.classList.remove('text-gray-600', 'hover:text-blue-500');
        } else {
            navElement.classList.remove('nav-active');
            navElement.classList.add('text-gray-600', 'hover:text-blue-500');
        }
    });
</script>
</body>
</html>
